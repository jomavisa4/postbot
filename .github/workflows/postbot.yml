# postbot.yml — publica sozinho 3x por dia, NA NUVEM (GitHub Actions).
# Não depende do seu PC estar ligado.
#
# Horários em UTC (o cron do GitHub é sempre UTC; Brasília = UTC-3):
#   12:00 UTC = 09:00 BRT
#   16:00 UTC = 13:00 BRT
#   22:00 UTC = 19:00 BRT
#
# Os segredos (token da Meta, chave do Gemini, etc.) ficam em
# Settings > Secrets and variables > Actions (nunca no código).
name: postbot (publicar)

on:
  schedule:
    - cron: "0 12 * * *"   # 09:00 (Brasília)
    - cron: "0 16 * * *"   # 13:00 (Brasília)
    - cron: "0 22 * * *"   # 19:00 (Brasília)
  workflow_dispatch:
    inputs:
      dry:
        description: "Só gerar (NÃO publicar) — útil para testar"
        type: boolean
        default: false
      foco:
        description: "Tema opcional (deixe vazio para a IA escolher)"
        type: string
        required: false
        default: ""

# Necessário para o bot poder subir a imagem (posts/*.png) neste repositório.
permissions:
  contents: write

# Evita duas execuções se sobreporem e darem conflito de push.
concurrency:
  group: postbot
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY:  ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL:    ${{ secrets.GEMINI_MODEL }}
      GEMINI_MODELOS:  ${{ secrets.GEMINI_MODELOS }}
      META_PAGE_ID:    ${{ secrets.META_PAGE_ID }}
      META_IG_ID:      ${{ secrets.META_IG_ID }}
      META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
      OFFER_URL:       ${{ secrets.OFFER_URL }}
      HANDLE:          ${{ secrets.HANDLE }}
      AUTO_PUBLISH:    "1"
      POSTS_PER_RUN:   "1"
      FOCO:            ${{ inputs.foco }}
      # A imagem do post vira URL pública no raw.githubusercontent deste repo.
      PUBLIC_IMAGE_REPO: "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
      PUBLIC_IMAGE_BASE: "https://raw.githubusercontent.com/${{ github.repository }}/main"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Fonte Selawik (compatível com Segoe UI) + fallback
        run: |
          sudo apt-get install -y fonts-liberation >/dev/null 2>&1 || true
          mkdir -p ~/.fonts ~/.config/fontconfig
          cp assets/fonts/*.ttf ~/.fonts/
          cp ci/fonts.conf ~/.config/fontconfig/fonts.conf
          fc-cache -f >/dev/null
          echo "Segoe UI resolve para: $(fc-match -f '%{family}' 'Segoe UI')"

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Gerar e publicar
        run: node autopost.mjs --now ${{ inputs.dry && '--dry' || '' }} ${FOCO:+--foco "$FOCO"}

      - name: Guardar os cards gerados (para conferir)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cards
          path: |
            queue/img/*.png
            queue/*.json
          if-no-files-found: ignore
          retention-days: 7
