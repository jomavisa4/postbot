<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  fonts.conf — usado SÓ no CI (GitHub Actions, Linux).
  No Windows o card já usa "Segoe UI". No Linux não existe Segoe UI, então
  mandamos o fontconfig trocar "Segoe UI" pela Selawik (mesma métrica,
  licença aberta). Assim o texto do card quebra/ajusta igual ao Windows.
-->
<fontconfig>
  <match target="pattern">
    <test qual="any" name="family">
      <string>Segoe UI</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Selawik</string>
    </edit>
  </match>
</fontconfig>
